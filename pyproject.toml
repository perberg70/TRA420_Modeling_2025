[project]
name = "tra420-modeling"
version = "0.1.0"
description = "Pipeline for TRA420 energy-emissions-climate modeling"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
markers = [
    "network: tests that download external data (e.g. RCMIP emissions via FaIR/pooch); deselect with -m 'not network'",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["build", "dist", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM"]
ignore = ["E203"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint.isort]
combine-as-imports = true
