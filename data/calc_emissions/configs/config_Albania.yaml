calc_emissions:
  emission_factors_file: data/calc_emissions/emission_factors/emission_factors_Albania.csv
  output_directory: results/emissions/Albania
  # Demand cases processed for every mix (must contain 'base_demand')
  demand_scenarios:
    base_demand:
      description: Albania base demand (was 'reference') (TWh).
      values:
        2025: 5.887708
        2027: 5.887708
        2100: 5.887708
    scen1_upper:
      description: >-
        Albania Scenario 1 Upper bound — dynamic from 2027 (subsidy-removal
        shock, then GDP/population/electrification growth). Pre-2027 demand is
        held at the workbook 2023 base demand. Replaces the previous static
        value of 4.604720 TWh from 2027.
      dynamic_model:
        mode: two_stage_reform
        base_year: 2023
        reform_year: 2027
        base_demand:
          source: data/calc_emissions/Electricity_OECD.xlsx
          country_code: ALB
          demand_column: Total electricity demand
          year: 2023
        reform:
          shiftable_share:
            source: workbook
          price_index:
            source: workbook
            bound: upper
          price_elasticity: TODO_SOURCE  # C_reform, must satisfy -0.8 <= C <= -0.2
        income:
          source: data/calc_emissions/demand_drivers/gdp.csv
          country_column: country_code
          country_code: ALB
          value_column: value
          filters:
            scenario: SSP2
        population:
          source: data/calc_emissions/demand_drivers/population.csv
          country_column: country_code
          country_code: ALB
          value_column: value
          filters:
            scenario: SSP2
        # post_reform_price omitted: held constant at the reform-year price
        # (index 1.0) until a post-reform price projection is supplied.
        electrification:
          form: linear_time
          A: TODO_SOURCE      # electrification share in base_year (within [0, 1])
          slope: TODO_SOURCE  # annual change in electrification share
        income_elasticity: TODO_SOURCE  # B, must be >= 1.0
        post_reform_price_elasticity:
          value: TODO_SOURCE  # C_t, must satisfy -0.8 <= C_t <= -0.2
    scen1_lower:
      description: >-
        Albania Scenario 1 Lower bound — dynamic from 2027 (subsidy-removal
        shock, then GDP/population/electrification growth). Pre-2027 demand is
        held at the workbook 2023 base demand. Replaces the previous static
        value of 5.301377 TWh from 2027.
      dynamic_model:
        mode: two_stage_reform
        base_year: 2023
        reform_year: 2027
        base_demand:
          source: data/calc_emissions/Electricity_OECD.xlsx
          country_code: ALB
          demand_column: Total electricity demand
          year: 2023
        reform:
          shiftable_share:
            source: workbook
          price_index:
            source: workbook
            bound: lower
          price_elasticity: TODO_SOURCE  # C_reform, must satisfy -0.8 <= C <= -0.2
        income:
          source: data/calc_emissions/demand_drivers/gdp.csv
          country_column: country_code
          country_code: ALB
          value_column: value
          filters:
            scenario: SSP2
        population:
          source: data/calc_emissions/demand_drivers/population.csv
          country_column: country_code
          country_code: ALB
          value_column: value
          filters:
            scenario: SSP2
        # post_reform_price omitted: held constant at the reform-year price
        # (index 1.0) until a post-reform price projection is supplied.
        electrification:
          form: linear_time
          A: TODO_SOURCE      # electrification share in base_year (within [0, 1])
          slope: TODO_SOURCE  # annual change in electrification share
        income_elasticity: TODO_SOURCE  # B, must be >= 1.0
        post_reform_price_elasticity:
          value: TODO_SOURCE  # C_t, must satisfy -0.8 <= C_t <= -0.2
    # moved custom_example from scenarios -> demand_scenarios if you want it evaluated as a demand case
    custom_example_demand:
      description: Custom demand example (TWh).
      values:
        2025: 13
        2030: 15
        2040: 17
        2050: 19
        2060: 21
        2070: 23
        2080: 25
        2090: 27
        2100: 29

  # Mix scenarios — top-level loop; each mix will be paired with every demand case above.
  mix_scenarios:
    base_mix:
      description: Baseline mix (time-series CSV).
      type: timeseries
      csv: country_data/electricity_mixes/electricity_mix_Albania_reference.csv
    WEM:
      description: With existing measures (time-series CSV).
      type: timeseries
      csv: country_data/electricity_mixes/electricity_mix_Albania_WEM.csv
    WAM:
      description: With additional measures (time-series CSV).
      type: timeseries
      csv: country_data/electricity_mixes/electricity_mix_Albania_WAM.csv
    # move mix_custom custom_example here so 'custom_example' mix is processed
    custom_example_mix:
      description: custom mix (copy from previous mix_custom)
      shares:
        coal: 0.08
        gas: 0.12
        hydro: 0.55
        wind: 0.13
        solar: 0.10

  # The old 'baseline' block and 'scenarios' list are no longer required by the new runner.
  # You can remove them or leave them as comments. The aggregator ignores the old 'scenarios' list.
