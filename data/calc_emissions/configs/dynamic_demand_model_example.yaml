# Dynamic electricity demand scenario template.
#
# Copy the relevant demand_scenarios entry into a country config under:
#   calc_emissions:
#     demand_scenarios:
#
# Keep TODO_SOURCE values until a data source or explicit scenario assumption
# has been selected. The model rejects TODO_SOURCE at runtime.
#
# Optional population block (shown in every template below): when present the
# income driver is interpreted as TOTAL GDP and converted internally to GDP
# per capita, and demand is additionally scaled by Pop_t / Pop_ref:
#   D_t = D_ref * (Pop_t/Pop_ref) * (e_t/e_ref) * (y_t/y_ref)^B * (P_t/P_ref)^C
# Omit the population block to keep the original total-income formula.

calc_emissions:
  demand_scenarios:
    dynamic_linear_time:
      description: Dynamic electricity demand using time-based electrification.
      dynamic_model:
        mode: total
        base_year: 2023
        base_demand:
          source: data/calc_emissions/Electricity_OECD.xlsx
          country_code: TODO_SOURCE
          demand_column: Total electricity demand
          year: 2023
        income:
          source: data/calc_emissions/demand_drivers/gdp.csv
          country_column: country_code
          country_code: TODO_SOURCE
          value_column: value
        population:
          source: data/calc_emissions/demand_drivers/population.csv
          country_column: country_code
          country_code: TODO_SOURCE
          value_column: value
        price:
          source: TODO_SOURCE
          value_column: TODO_SOURCE
        electrification:
          form: linear_time
          A: TODO_SOURCE
          slope: TODO_SOURCE
        income_elasticity: TODO_SOURCE  # B, must be >= 1.0
        price_elasticity: TODO_SOURCE  # C, must satisfy -0.8 <= C <= -0.2

    dynamic_linear_income:
      description: Dynamic electricity demand using income-based electrification.
      dynamic_model:
        mode: total
        base_year: 2023
        base_demand:
          source: data/calc_emissions/Electricity_OECD.xlsx
          country_code: TODO_SOURCE
          demand_column: Total electricity demand
          year: 2023
        income:
          source: data/calc_emissions/demand_drivers/gdp.csv
          country_column: country_code
          country_code: TODO_SOURCE
          value_column: value
        population:
          source: data/calc_emissions/demand_drivers/population.csv
          country_column: country_code
          country_code: TODO_SOURCE
          value_column: value
        price:
          source: TODO_SOURCE
          value_column: TODO_SOURCE
        electrification:
          form: linear_income
          base_share: TODO_SOURCE
          slope: TODO_SOURCE
        income_elasticity: TODO_SOURCE  # B, must be >= 1.0
        price_elasticity: TODO_SOURCE  # C, must satisfy -0.8 <= C <= -0.2

    dynamic_two_stage_reform:
      description: Dynamic demand with a one-time subsidy-removal shock in 2027.
      dynamic_model:
        mode: two_stage_reform
        base_year: 2023
        reform_year: 2027
        base_demand:
          source: data/calc_emissions/Electricity_OECD.xlsx
          country_code: TODO_SOURCE
          demand_column: Total electricity demand
          year: 2023
        reform:
          # D_shiftable_0 = workbook base demand * shiftable_share.
          # D_residual_0 = workbook base demand - D_shiftable_0.
          # 'source: workbook' derives the value from Electricity_OECD.xlsx:
          #   shiftable_share = regulated demand / total demand (Reference values)
          #   price_index = Scenario 1 regulated price / base regulated price
          shiftable_share:
            source: workbook
          price_index:
            source: workbook
            bound: lower  # 'lower' or 'upper' Scenario 1 bound table
          price_elasticity: TODO_SOURCE  # C_reform, -0.8 <= C <= -0.2
          # Explicit scalars remain supported instead of the workbook keys:
          # shiftable_share: 0.76
          # price_index: 1.29
        income:
          source: data/calc_emissions/demand_drivers/gdp.csv
          country_column: country_code
          country_code: TODO_SOURCE
          value_column: value
        population:
          source: data/calc_emissions/demand_drivers/population.csv
          country_column: country_code
          country_code: TODO_SOURCE
          value_column: value
        # post_reform_price is optional. When omitted the homogeneous
        # post-reform price is held constant at the reform-year level
        # (index 1.0 in every year). Provide a path to override:
        # post_reform_price:
        #   source: TODO_SOURCE
        #   value_column: TODO_SOURCE
        electrification:
          form: linear_income
          base_share: TODO_SOURCE
          slope: TODO_SOURCE
        income_elasticity: TODO_SOURCE  # B, must be >= 1.0
        post_reform_price_elasticity:
          value: TODO_SOURCE  # Fixed C_t, -0.8 <= C_t <= -0.2
          # Or use year-indexed C_t values with decreasing price sensitivity:
          # values:
          #   2027: -0.6
          #   2035: -0.4
          #   2050: -0.2
